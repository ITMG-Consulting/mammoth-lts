name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # weekly: rebuild on base image updates, and catch new php-src advisories
    - cron: 0 3 * * 1

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GitHub Container Registry, ghcr.io/<owner>/<repo> (lowercased below: image names must be lowercase)
  IMAGE: ghcr.io/${{ github.repository }}

jobs:

  generate:
    runs-on: ubuntu-latest
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
      versions: ${{ steps.dirs.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generated files are up to date
        run: |
          ./apply-templates.sh
          python3 tools/security-report.py
          git diff --exit-code
      # pull requests and pushes only build what changed; the weekly / manual runs rebuild everything (base image updates)
      - id: dirs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          all="$(jq -c '[to_entries[] | select(.value) | .key as $v | .value.variants[] | "\($v)/\(.)"]' versions.json)"
          if [[ "${{ github.event_name }}" =~ ^(schedule|workflow_dispatch)$ ]] || ! git cat-file -e "${BASE:-0000}^{commit}" 2> /dev/null; then
            dirs="$all"
          else
            changed="$(git diff --name-only "$BASE" HEAD)"
            # generated dirs embed the template, the scripts and the patches: any change there shows up in <version>/<suite>/<variant>/
            dirs="$(jq -c --arg changed "$changed" '[.[] | . as $d | select($changed | split("\n") | any(startswith($d + "/")))]' <<< "$all")"
            # the test harness itself changed: re-run every branch
            if grep -qE '^(tools/(run-php-tests|tags)\.sh|\.github/workflows/)' <<< "$changed"; then dirs="$all"; fi
          fi
          # known-test-failures is not part of the build context, only of the make test job
          tests="$(git diff --name-only "${BASE:-HEAD}" HEAD 2> /dev/null | sed -n 's#^patches/\([^/]*\)/known-test-failures$#\1#p' | jq -Rc '[., inputs]' 2> /dev/null || echo '[]')"
          echo "dirs=$dirs" >> "$GITHUB_OUTPUT"
          echo "versions=$(jq -c --argjson tests "${tests:-[]}" '[(.[] | split("/")[0]), ($tests[] | select(. != ""))] | unique' <<< "$dirs")" >> "$GITHUB_OUTPUT"

  build:
    needs: generate
    if: needs.generate.outputs.dirs != '[]'
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.generate.outputs.dirs) }}
    name: ${{ matrix.dir }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build --pull --tag "test:${{ github.run_id }}" "${{ matrix.dir }}"
      - name: Smoke tests
        run: |
          version="${{ matrix.dir }}"; version="${version%%/*}"
          expected="$(jq -r --arg v "$version" '.[$v].version + .[$v].extraVersion' versions.json)"
          img="test:${{ github.run_id }}"
          docker run --rm "$img" php -v | tee /dev/stderr | grep -F "PHP $expected "
          docker run --rm "$img" php -r 'exit(PHP_VERSION === getenv("PHP_VERSION") ? 0 : 1);'
          docker run --rm "$img" php -m
          case "${{ matrix.dir }}" in
            */fpm) docker run --rm "$img" php-fpm -t ;;
            */apache) docker run --rm "$img" apache2ctl -t ;;
          esac
          # extensions users build on top of the image (pecl, docker-php-ext-*), exercise C++ (intl) and pkg-config detection (gd)
          case "${{ matrix.dir }}" in
            */alpine*) deps='apk add --no-cache icu-dev freetype-dev libjpeg-turbo-dev libpng-dev' ;;
            # libfreetype-dev only exists since bullseye (libfreetype6-dev before)
            *) deps='apt-get update && apt-get install -y --no-install-recommends libicu-dev libjpeg-dev libpng-dev $(apt-cache show libfreetype-dev > /dev/null 2>&1 && echo libfreetype-dev || echo libfreetype6-dev)' ;;
          esac
          # gd < 7.4 takes --with-freetype-dir, 7.4+ --with-freetype
          docker run --rm "$img" sh -euxc "
            $deps
            docker-php-ext-configure gd --with-freetype-dir=/usr --with-jpeg-dir=/usr 2> /dev/null || docker-php-ext-configure gd --with-freetype --with-jpeg
            docker-php-ext-install -j\$(nproc) intl gd bcmath
            php -m | grep -E '^(intl|gd|bcmath)$' | wc -l | grep -qx 3
            php -r 'exit(gd_info()[\"FreeType Support\"] ? 0 : 1);'
          "

  php-tests:
    needs: generate
    if: needs.generate.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.generate.outputs.versions) }}
    name: make test ${{ matrix.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/src:ro" alpine:3.23 /src/tools/run-php-tests.sh "${{ matrix.version }}"

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # informative: a new php-src advisory must be triaged (patches/<version>/triage) or backported
      - run: python3 tools/advisory-coverage.py
        continue-on-error: true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.generate.outputs.dirs != '[]' && !failure() && !cancelled()
    needs: [generate, build, php-tests]
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.generate.outputs.dirs) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          IMAGE="${IMAGE,,}"
          tags=()
          for t in $(tools/tags.sh "${{ matrix.dir }}"); do tags+=( --tag "$IMAGE:$t" ); done
          docker build --pull "${tags[@]}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.description="Mammoth LTS: security-patched Docker images for end-of-life PHP" \
            --label org.opencontainers.image.licenses="PHP-3.01" \
            "${{ matrix.dir }}"
          for t in $(tools/tags.sh "${{ matrix.dir }}"); do docker push "$IMAGE:$t"; done
