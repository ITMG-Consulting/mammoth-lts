name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # weekly: rebuild on base image updates, catch new php-src advisories and deb.sury.org revisions
    - cron: 0 3 * * 1

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GitHub Container Registry, ghcr.io/<owner>/<repo> (lowercased below: image names must be lowercase)
  IMAGE: ghcr.io/${{ github.repository }}
  DESCRIPTION: "Mammoth LTS: drop-in Docker images for end-of-life PHP 7.0-8.1 with security fixes backported (deb.sury.org + php-src)"

jobs:

  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the last successful run on main is the base of a push (step dirs)
      actions: read
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
      targets: ${{ steps.dirs.outputs.targets }}
      versions: ${{ steps.dirs.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generated files are up to date
        run: |
          ./apply-templates.sh
          python3 tools/security-report.py
          tools/readme-tags.sh
          git diff --exit-code
      # pull requests and pushes only build what changed; the weekly / manual runs rebuild everything (base image updates)
      - id: dirs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          all="$(jq -c '[to_entries[] | select(.value) | .key as $v | .value.variants[] | "\($v)/\(.)"]' versions.json)"
          # a push builds what changed since the last successful run on main, not since the previous push: the images
          # of a failed or cancelled run are not published, and the next push must build them too
          if [ "${{ github.event_name }}" = push ]; then
            BASE="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
            git merge-base --is-ancestor "${BASE:-0000}" HEAD 2> /dev/null || BASE=
          fi
          if [[ "${{ github.event_name }}" =~ ^(schedule|workflow_dispatch)$ ]] || ! git cat-file -e "${BASE:-0000}^{commit}" 2> /dev/null; then
            dirs="$all"
          else
            changed="$(git diff --name-only "$BASE" HEAD)"
            # through a file: a new branch changes thousands of paths, too long for one argument (E2BIG)
            printf '%s\n' "$changed" > "$RUNNER_TEMP/changed"
            # generated dirs embed the template, the scripts and the patches: any change there shows up in <version>/<suite>/<variant>/
            dirs="$(jq -c --rawfile changed "$RUNNER_TEMP/changed" '[.[] | . as $d | select($changed | split("\n") | any(startswith($d + "/")))]' <<< "$all")"
            # the test harness itself changed: re-run every branch
            if grep -qE '^(tools/(run-php-tests|tags)\.sh|\.github/workflows/)' <<< "$changed"; then dirs="$all"; fi
          fi
          # known-test-failures is not part of the build context, only of the make test job
          tests="$(git diff --name-only "${BASE:-HEAD}" HEAD 2> /dev/null | sed -n 's#^patches/\([^/]*\)/known-test-failures$#\1#p' | jq -Rc '[., inputs]' 2> /dev/null || echo '[]')"
          # one target per architecture: amd64 everywhere, arm64 where the base image has it (noArm64Suites)
          targets="$(jq -c --slurpfile v versions.json '[
            .[]
            | split("/") as $p
            | { dir: ., arch: "amd64", runner: "ubuntu-latest" },
              (if ($v[0][$p[0]].noArm64Suites // []) | index($p[1]) then empty
               else { dir: ., arch: "arm64", runner: "ubuntu-24.04-arm" } end)
          ]' <<< "$dirs")"
          {
            echo "dirs=$dirs"
            echo "targets=$targets"
            echo "versions=$(jq -c --argjson tests "${tests:-[]}" '[(.[] | split("/")[0]), ($tests[] | select(. != ""))] | unique' <<< "$dirs")"
          } >> "$GITHUB_OUTPUT"

  build:
    needs: generate
    if: needs.generate.outputs.dirs != '[]'
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.generate.outputs.targets) }}
    name: ${{ matrix.target.dir }} ${{ matrix.target.arch }}
    # native runners: compiling PHP under QEMU would be an order of magnitude slower
    runs-on: ${{ matrix.target.runner }}
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: docker build --pull --tag "test:${{ github.run_id }}" "${{ matrix.target.dir }}"
      - name: Smoke tests
        run: |
          version="${{ matrix.target.dir }}"; version="${version%%/*}"
          expected="$(jq -r --arg v "$version" '.[$v].version + .[$v].extraVersion' versions.json)"
          img="test:${{ github.run_id }}"
          docker run --rm "$img" php -v | tee /dev/stderr | grep -F "PHP $expected "
          docker run --rm "$img" php -r 'exit(PHP_VERSION === getenv("PHP_VERSION") ? 0 : 1);'
          docker run --rm "$img" php -m
          case "${{ matrix.target.dir }}" in
            */fpm) docker run --rm "$img" php-fpm -t ;;
            */apache) docker run --rm "$img" apache2ctl -t ;;
          esac
          # extensions users build on top of the image (pecl, docker-php-ext-*), exercise C++ (intl) and pkg-config detection (gd)
          case "${{ matrix.target.dir }}" in
            */alpine*) deps='apk add --no-cache icu-dev freetype-dev libjpeg-turbo-dev libpng-dev' ;;
            # libfreetype-dev only exists since bullseye (libfreetype6-dev before)
            *) deps='apt-get update && apt-get install -y --no-install-recommends libicu-dev libjpeg-dev libpng-dev $(apt-cache show libfreetype-dev > /dev/null 2>&1 && echo libfreetype-dev || echo libfreetype6-dev)' ;;
          esac
          # gd < 7.4 takes --with-freetype-dir, 7.4+ --with-freetype
          docker run --rm "$img" sh -euxc "
            $deps
            docker-php-ext-configure gd --with-freetype-dir=/usr --with-jpeg-dir=/usr 2> /dev/null || docker-php-ext-configure gd --with-freetype --with-jpeg
            docker-php-ext-install -j\$(nproc) intl gd bcmath
            php -m | grep -E '^(intl|gd|bcmath)$' | wc -l | grep -qx 3
            php -r 'exit(gd_info()[\"FreeType Support\"] ? 0 : 1);'
          "

  php-tests:
    needs: generate
    if: needs.generate.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.generate.outputs.versions) }}
    name: make test ${{ matrix.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/src:ro" alpine:3.23 /src/tools/run-php-tests.sh "${{ matrix.version }}"

  asan:
    needs: generate
    if: needs.generate.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.generate.outputs.versions) }}
    name: asan ${{ matrix.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ASan cannot map its shadow memory with the ASLR entropy of recent kernels
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      # informative until a first clean run, then make publish depend on it
      - run: docker run --rm -v "$PWD:/src:ro" debian:bookworm /src/tools/run-asan-tests.sh "${{ matrix.version }}"
        continue-on-error: true

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # informative: a new php-src advisory must be triaged (patches/<version>/triage) or backported
      - run: python3 tools/advisory-coverage.py
        continue-on-error: true

  sury:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # informative: a new deb.sury.org revision changes the patches of a branch -> tools/import-sury-patches.sh <version>
      - run: |
          rc=0
          for version in $(jq -r 'to_entries[] | select(.value.patches) | .key' versions.json); do
            tools/import-sury-patches.sh --check "$version" || rc=1
          done
          exit "$rc"
        continue-on-error: true

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # informative: a new docker-library/php commit must be triaged in upstream.reviewed (ported / not-applicable)
      - run: tools/upstream-review.sh --diff
        continue-on-error: true

  publish:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.generate.outputs.dirs != '[]' && !failure() && !cancelled()
    needs: [generate, build, php-tests]
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.generate.outputs.targets) }}
    name: publish ${{ matrix.target.dir }} ${{ matrix.target.arch }}
    runs-on: ${{ matrix.target.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # push-by-digest needs a driver that can output to a registry: the default "docker" driver cannot
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # each architecture is pushed untagged, by digest; the "manifest" job assembles the tags from the digests
      - name: Build and push by digest
        id: push
        run: |
          IMAGE="${IMAGE,,}"
          docker buildx build --pull \
            --platform "linux/${{ matrix.target.arch }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.description="$DESCRIPTION" \
            --label org.opencontainers.image.licenses="PHP-3.01" \
            --provenance=false \
            --metadata-file metadata.json \
            --output "type=image,name=$IMAGE,push-by-digest=true,name-canonical=true,push=true" \
            "${{ matrix.target.dir }}"
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          [ -n "$digest" ] && [ "$digest" != null ]
          mkdir -p digests && echo "$digest" > "digests/${digest#sha256:}"
          echo "slug=$(tr / - <<< '${{ matrix.target.dir }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.push.outputs.slug }}-${{ matrix.target.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.generate.outputs.dirs != '[]' && !failure() && !cancelled()
    needs: [generate, publish]
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.generate.outputs.dirs) }}
    name: manifest ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: slug
        run: echo "slug=$(tr / - <<< '${{ matrix.dir }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ steps.slug.outputs.slug }}-*
          path: digests
          merge-multiple: true
      # the tags of this directory point to a manifest list of the per-architecture digests (one entry for the
      # suites without an arm64 base image); the labels are on the images, the annotations on the list itself
      - name: Tags
        run: |
          IMAGE="${IMAGE,,}"
          mapfile -t all < <(tools/tags.sh "${{ matrix.dir }}")
          tags=() sources=()
          for t in "${all[@]}"; do tags+=( --tag "$IMAGE:$t" ); done
          for d in digests/*; do sources+=( "$IMAGE@sha256:$(basename "$d")" ); done
          [ "${#sources[@]}" -gt 0 ]
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.licenses=PHP-3.01" \
            "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${all[0]}"
