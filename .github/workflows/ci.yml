name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # weekly: rebuild on base image updates, catch new php-src advisories and deb.sury.org revisions
    - cron: 0 3 * * 1

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # GitHub Container Registry, ghcr.io/<owner>/<repo> (lowercased below: image names must be lowercase)
  IMAGE: ghcr.io/${{ github.repository }}
  DESCRIPTION: "Mammoth LTS: drop-in Docker images for end-of-life PHP 7.0-8.1 with security fixes backported (deb.sury.org + php-src)"

jobs:

  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # the last successful run on main is the base of a push (step dirs)
      actions: read
    outputs:
      dirs: ${{ steps.dirs.outputs.dirs }}
      dirs_arm64: ${{ steps.dirs.outputs.dirs_arm64 }}
      versions: ${{ steps.dirs.outputs.versions }}
      image: ${{ steps.dirs.outputs.image }}
      description: ${{ steps.dirs.outputs.description }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Generated files are up to date
        run: |
          ./apply-templates.sh
          python3 tools/security-report.py
          tools/readme-tags.sh
          git diff --exit-code
      # pull requests and pushes only build what changed; the weekly / manual runs rebuild everything (base image updates)
      - id: dirs
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || '' }}
          GH_TOKEN: ${{ github.token }}
        run: |
          all="$(jq -c '[to_entries[] | select(.value) | .key as $v | .value.variants[] | "\($v)/\(.)"]' versions.json)"
          # a push builds what changed since the last successful run on main, not since the previous push: the images
          # of a failed or cancelled run are not published, and the next push must build them too
          if [ "${{ github.event_name }}" = push ]; then
            BASE="$(gh api "repos/${{ github.repository }}/actions/workflows/ci.yml/runs?branch=main&status=success&per_page=1" --jq '.workflow_runs[0].head_sha // empty')"
            git merge-base --is-ancestor "${BASE:-0000}" HEAD 2> /dev/null || BASE=
          fi
          if [[ "${{ github.event_name }}" =~ ^(schedule|workflow_dispatch)$ ]] || ! git cat-file -e "${BASE:-0000}^{commit}" 2> /dev/null; then
            dirs="$all"
          else
            changed="$(git diff --name-only "$BASE" HEAD)"
            # through a file: a new branch changes thousands of paths, too long for one argument (E2BIG)
            printf '%s\n' "$changed" > "$RUNNER_TEMP/changed"
            # generated dirs embed the template, the scripts and the patches: any change there shows up in <version>/<suite>/<variant>/
            dirs="$(jq -c --rawfile changed "$RUNNER_TEMP/changed" '[.[] | . as $d | select($changed | split("\n") | any(startswith($d + "/")))]' <<< "$all")"
            # the test harness itself changed: re-run every branch
            if grep -qE '^(tools/(run-php-tests|tags)\.sh|\.github/workflows/)' <<< "$changed"; then dirs="$all"; fi
          fi
          # known-test-failures is not part of the build context, only of the make test job
          tests="$(git diff --name-only "${BASE:-HEAD}" HEAD 2> /dev/null | sed -n 's#^patches/\([^/]*\)/known-test-failures$#\1#p' | jq -Rc '[., inputs]' 2> /dev/null || echo '[]')"
          # amd64 everywhere, arm64 where the base image has it (noArm64Suites); build and publish take one
          # architecture each, a matrix is capped at 256 jobs and (dirs x architectures) is above that
          dirs_arm64="$(jq -c --slurpfile v versions.json '[
            .[]
            | . as $d
            | split("/") as $p
            | if ($v[0][$p[0]].noArm64Suites // []) | index($p[1]) then empty else $d end
          ]' <<< "$dirs")"
          n="$(jq length <<< "$dirs")"; [ "$n" -le 256 ] || { echo >&2 "error: $n dirs, over the 256-job matrix cap: split build/publish further"; exit 1; }
          {
            echo "dirs=$dirs"
            echo "dirs_arm64=$dirs_arm64"
            echo "versions=$(jq -c --argjson tests "${tests:-[]}" '[(.[] | split("/")[0]), ($tests[] | select(. != ""))] | unique' <<< "$dirs")"
            echo "image=${IMAGE,,}"
            echo "description=$DESCRIPTION"
          } >> "$GITHUB_OUTPUT"

  # native runners, never QEMU: compiling PHP emulated would be an order of magnitude slower
  build-amd64:
    needs: generate
    if: needs.generate.outputs.dirs != '[]'
    uses: ./.github/workflows/build.yml
    with:
      dirs: ${{ needs.generate.outputs.dirs }}
      runner: ubuntu-latest

  build-arm64:
    needs: generate
    if: needs.generate.outputs.dirs_arm64 != '[]'
    uses: ./.github/workflows/build.yml
    with:
      dirs: ${{ needs.generate.outputs.dirs_arm64 }}
      runner: ubuntu-24.04-arm

  php-tests:
    needs: generate
    if: needs.generate.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.generate.outputs.versions) }}
    name: make test ${{ matrix.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker run --rm -v "$PWD:/src:ro" alpine:3.23 /src/tools/run-php-tests.sh "${{ matrix.version }}"

  asan:
    needs: generate
    if: needs.generate.outputs.versions != '[]'
    strategy:
      fail-fast: false
      matrix:
        version: ${{ fromJson(needs.generate.outputs.versions) }}
    name: asan ${{ matrix.version }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # ASan cannot map its shadow memory with the ASLR entropy of recent kernels
      - run: sudo sysctl -w vm.mmap_rnd_bits=28
      # informative until a first clean run, then make publish depend on it
      - run: docker run --rm -v "$PWD:/src:ro" debian:bookworm /src/tools/run-asan-tests.sh "${{ matrix.version }}"
        continue-on-error: true

  advisories:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # informative: a new php-src advisory must be triaged (patches/<version>/triage) or backported
      - run: python3 tools/advisory-coverage.py
        continue-on-error: true

  sury:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # informative: a new deb.sury.org revision changes the patches of a branch -> tools/import-sury-patches.sh <version>
      - run: |
          rc=0
          for version in $(jq -r 'to_entries[] | select(.value.patches) | .key' versions.json); do
            tools/import-sury-patches.sh --check "$version" || rc=1
          done
          exit "$rc"
        continue-on-error: true

  upstream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      # informative: a new docker-library/php commit must be triaged in upstream.reviewed (ported / not-applicable)
      - run: tools/upstream-review.sh --diff
        continue-on-error: true

  publish-amd64:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.generate.outputs.dirs != '[]' && !failure() && !cancelled()
    needs: [generate, build-amd64, build-arm64, php-tests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      dirs: ${{ needs.generate.outputs.dirs }}
      arch: amd64
      runner: ubuntu-latest
      image: ${{ needs.generate.outputs.image }}
      description: ${{ needs.generate.outputs.description }}

  publish-arm64:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.generate.outputs.dirs_arm64 != '[]' && !failure() && !cancelled()
    needs: [generate, build-amd64, build-arm64, php-tests]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.yml
    with:
      dirs: ${{ needs.generate.outputs.dirs_arm64 }}
      arch: arm64
      runner: ubuntu-24.04-arm
      image: ${{ needs.generate.outputs.image }}
      description: ${{ needs.generate.outputs.description }}

  manifest:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.generate.outputs.dirs != '[]' && !failure() && !cancelled()
    needs: [generate, publish-amd64, publish-arm64]
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(needs.generate.outputs.dirs) }}
    name: manifest ${{ matrix.dir }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: slug
        run: echo "slug=$(tr / - <<< '${{ matrix.dir }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          pattern: digest-${{ steps.slug.outputs.slug }}-*
          path: digests
          merge-multiple: true
      # the tags of this directory point to a manifest list of the per-architecture digests (one entry for the
      # suites without an arm64 base image); the labels are on the images, the annotations on the list itself
      - name: Tags
        run: |
          IMAGE="${IMAGE,,}"
          mapfile -t all < <(tools/tags.sh "${{ matrix.dir }}")
          tags=() sources=()
          for t in "${all[@]}"; do tags+=( --tag "$IMAGE:$t" ); done
          for d in digests/*; do sources+=( "$IMAGE@sha256:$(basename "$d")" ); done
          [ "${#sources[@]}" -gt 0 ]
          docker buildx imagetools create \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.revision=${{ github.sha }}" \
            --annotation "index:org.opencontainers.image.description=$DESCRIPTION" \
            --annotation "index:org.opencontainers.image.licenses=PHP-3.01" \
            "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:${all[0]}"
