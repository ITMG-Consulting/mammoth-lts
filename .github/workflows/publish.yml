name: publish

# One job per directory, on the runner of a single architecture (see build.yml for the 256-job matrix cap).
# Each architecture is pushed untagged, by digest; ci.yml's "manifest" job assembles the tags of a directory.
on:
  workflow_call:
    inputs:
      dirs:
        required: true
        type: string
      arch:
        required: true
        type: string
      runner:
        required: true
        type: string
      image:
        required: true
        type: string
      description:
        required: true
        type: string

defaults:
  run:
    shell: 'bash -Eeuo pipefail -x {0}'

jobs:

  publish:
    strategy:
      fail-fast: false
      matrix:
        dir: ${{ fromJson(inputs.dirs) }}
    name: ${{ matrix.dir }}
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v5
      # push-by-digest needs a driver that can output to a registry: the default "docker" driver cannot
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push by digest
        id: push
        run: |
          docker buildx build --pull \
            --platform "linux/${{ inputs.arch }}" \
            --label org.opencontainers.image.source="${{ github.server_url }}/${{ github.repository }}" \
            --label org.opencontainers.image.revision="${{ github.sha }}" \
            --label org.opencontainers.image.description="${{ inputs.description }}" \
            --label org.opencontainers.image.licenses="PHP-3.01" \
            --provenance=false \
            --metadata-file metadata.json \
            --output "type=image,name=${{ inputs.image }},push-by-digest=true,name-canonical=true,push=true" \
            "${{ matrix.dir }}"
          digest="$(jq -r '."containerimage.digest"' metadata.json)"
          [ -n "$digest" ] && [ "$digest" != null ]
          mkdir -p digests && echo "$digest" > "digests/${digest#sha256:}"
          echo "slug=$(tr / - <<< '${{ matrix.dir }}')" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: digest-${{ steps.push.outputs.slug }}-${{ inputs.arch }}
          path: digests/*
          if-no-files-found: error
          retention-days: 1
